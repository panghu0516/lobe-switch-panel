name: Build and Push to ACR

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'src/**'
      - 'backup-image/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute version tag
        run: echo "VERSION_TAG=v$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push panel (latest + versioned)
        run: |
          set -eu
          IMG="${{ secrets.ACR_REGISTRY }}/tigerhuang/lobe-switch-panel"
          echo "pushing $IMG:latest + $IMG:$VERSION_TAG"
          docker build -t "$IMG:latest" -t "$IMG:$VERSION_TAG" .
          docker push "$IMG:latest"
          docker push "$IMG:$VERSION_TAG"

      - name: Build and push backup image (latest + versioned)
        run: |
          set -eu
          BK="${{ secrets.ACR_REGISTRY }}/tigerhuang/pg-backup-s3-pg17"
          echo "pushing $BK:latest + $BK:$VERSION_TAG"
          docker build -t "$BK:latest" -t "$BK:$VERSION_TAG" ./backup-image
          docker push "$BK:latest"
          docker push "$BK:$VERSION_TAG"
